# Команды tmux, разбитые по группам.
# Формат строки: КЛАВИША|Описание (по-русски)|команда tmux
# Строки с # и пустые игнорируются. [Группа] начинает новую группу.
# Специальный разделитель команд в tmux — точка с запятой: пиши \; (в файле обратный слеш).

[Сессии]
M-w|Дерево сессий|choose-tree -s
M-d|Отсоединиться от сессии|detach
M-Q|Завершить сессию с подтверждением|confirm-before -p "Kill entire session? (y/n)" kill-session
M-n|Новая именованная сессия|command-prompt -p "Новая сессия: " new-session -d -s '%%' \; switch-client -t '%%'
M-R|Переименовать сессию|command-prompt -I "#{session_name}" -p "Имя сессии: " rename-session '%%'

[Окна]
M-1|Перейти в окно 1|select-window -t 1
M-2|Перейти в окно 2|select-window -t 2
M-3|Перейти в окно 3|select-window -t 3
M-4|Перейти в окно 4|select-window -t 4
M-5|Перейти в окно 5|select-window -t 5
M-6|Перейти в окно 6|select-window -t 6
M-7|Перейти в окно 7|select-window -t 7
M-8|Перейти в окно 8|select-window -t 8
M-9|Перейти в окно 9|select-window -t 9
M-,|Предыдущее окно|previous-window
M-.|Следующее окно|next-window
M-o|Последнее активное окно|last-window
M-Enter|Новое окно|new-window
M-q|Закрыть окно|kill-window

[Панели]
M-h|Панель слева|select-pane -L
M-j|Панель снизу|select-pane -D
M-k|Панель сверху|select-pane -U
M-l|Панель справа|select-pane -R
M-v|Разделить панель по вертикали|split-window -h -c "#{pane_current_path}"
M-s|Разделить панель по горизонтали (20%)|split-window -v -l 20% -c "#{pane_current_path}"
M-c|Закрыть панель|kill-pane
M-f|Зум панели на весь экран / обратно|resize-pane -Z
M-S-Left|Изменить размер панели ←|resize-pane -L 5
M-S-Right|Изменить размер панели →|resize-pane -R 5
M-S-Up|Изменить размер панели ↑|resize-pane -U 3
M-S-Down|Изменить размер панели ↓|resize-pane -D 3
M-C-h|Уменьшить панель влево|resize-pane -L 5
M-C-j|Увеличить панель вниз|resize-pane -D 5
M-C-k|Уменьшить панель вверх|resize-pane -U 5
M-C-l|Увеличить панель вправо|resize-pane -R 5
M-C-,|Обмен окон местами ←|swap-window -t -1 \; select-window -t -1
M-C-.|Обмен окон местами →|swap-window -t +1 \; select-window -t +1

[Копирование (vi-режим)]
M-y|Войти в режим копирования|copy-mode
v|Начать выделение|send-keys -X begin-selection
V|Выделить строку|send-keys -X select-line
C-v|Прямоугольное выделение|send-keys -X rectangle-toggle
y|Скопировать выделенное|send-keys -X copy-selection
q|Выйти без копирования|send-keys -X cancel

[Прочее]
M-r|Перезагрузить конфиг|source-file ~/.config/tmux/tmux.conf
F12|Справка (TUI меню)|keys-tui
F1|Эта справка (поп-ап)|keys-tui