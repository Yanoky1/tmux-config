# tmux конфигурация (без префикса — все бинды на Alt/Meta)
# ---------------------------------------------------------------------------
# Все сочетания клавиш ниже работают БЕЗ нажатия префикса tmux.
# Каждое сочетание начинается с Alt (M-).

# Корректное отображение цветовых схем
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'

# Сбросить все стандартные бинды в таблице root
unbind-key -a -T root

# Нумерация окон и панелей начинается с 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Вим-стиль навигации в режиме копирования
setw -g mode-keys vi

# Поддержка мыши: переключение панелей, ресайз, прокрутка
set -g mouse on

# Убрать задержку после Esc (обязательно для vim/neovim внутри tmux)
set -s escape-time 0

# Размер истории буфера
set -g history-limit 2000

# ===========================================================================
# СЕССИИ (Alt)
# ===========================================================================
# Дерево сессий (Alt+w)
bind -n M-w choose-tree -s
# Отсоединиться от сессии
bind -n M-d detach
# Завершить всю сессию с подтверждением
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session
# Создать новую именованную сессию и переключиться на неё
bind -n M-n command-prompt -p "Новая сессия: " "new-session -d -s '%%' \; switch-client -t '%%'"

# ===========================================================================
# ОКНА (Alt)
# ===========================================================================
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-, previous-window
bind -n M-. next-window
bind -n M-o last-window
bind -n M-Enter new-window
bind -n M-q kill-window
# Новые окна открываются после текущего, в той же директории
bind c new-window -a -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

# ===========================================================================
# ПАНЕЛИ (Alt)
# ===========================================================================
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Разделение окон (vim-стиль)
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"
# Закрыть панель
bind -n M-c kill-pane
# Зум панели на весь экран и обратно
bind -n M-f resize-pane -Z
# Изменение размера панели (Alt+Shift+стрелки)
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 3
bind -n M-S-Down resize-pane -D 3
# Изменение размера панелей (Alt+Ctrl+j/k/h/l)
bind -n M-C-h resize-pane -L 5
bind -n M-C-j resize-pane -D 5
bind -n M-C-k resize-pane -U 5
bind -n M-C-l resize-pane -R 5
# Обмен окнами местами (Alt+Ctrl+< / >)
bind -n M-C-, swap-window -t -1 \; select-window -t -1
bind -n M-C-. swap-window -t +1 \; select-window -t +1
# Обмен окон местами (удерживать стрелку, с префиксом)
bind -r Left swap-window -t -1 \; select-window -t -1
bind -r Right swap-window -t +1 \; select-window -t +1

# ===========================================================================
# РЕЖИМ КОПИРОВАНИЯ (vim-стиль)
# ===========================================================================
bind -n M-y copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi q send-keys -X cancel
set -g allow-passthrough on
set -s set-clipboard on
setw -g mode-style 'fg=#a7d8b0'

# ===========================================================================
# ОФОРМЛЕНИЕ
# ===========================================================================
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g status-position bottom
set -g status-justify left
set -g status-left-length 20
set -g pane-border-lines single
setw -g window-status-style 'bg=default'
setw -g window-status-current-style 'bg=default'
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S / #W / #{pane_current_path}"

# ===========================================================================
# ПРОЧЕЕ
# ===========================================================================
# Перезагрузить конфиг (Alt+r)
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# F12 — TUI-справочник клавиш по группам (полный экран, без отступов)
bind -n F12 display-popup -w 50% -h 80% -T " tmux keys " "bash ~/.config/tmux/keys-tui"

# F12 — показать все сочетания клавиш без префикса (сырой список)
# bind -n F12 display-popup -w 90% -h 90% "tmux list-keys -T root | pr -2 -t | less -R"

# ===========================================================================
# ШПАРГАЛКА (две колонки: клавиша  действие)
# ===========================================================================
# СЕССИИ          M-w дерево сессий          M-d отсоединиться
#                 M-n новая именованная      M-R переименовать
#                 M-Q убить сессию
# ОКНА            M-1..9 окно 1..9           M-, пред. окно
#                 M-. след. окно             M-o последнее окно
#                 M-Enter новое окно         M-q закрыть окно
# ПАНЕЛИ          M-h/j/k/l навигация        M-v разд. вертикально
#                 M-s разд. гориз. (20%)     M-c закрыть панель
#                 M-f зум панели             M-S-←/→/↑/↓ ресайз
#                 M-C-h/j/k/l ресайз         M-C-, / M-C-. обмен окнами
# КОПИРОВАНИЕ     M-y войти в режим          v выделение
#                 y копировать               q выйти
# ПРОЧЕЕ          M-r перезагрузить конфиг   F12 справка

# Менеджер плагинов TPM (обязательно в конце)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run '~/.config/tmux/plugins/tpm/tpm'
